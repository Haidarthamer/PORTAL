name: PORTAL Build Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Android build
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "android.yml",
              branch: "main",
              per_page: 1
            });

            const run = runs.data.workflow_runs[0];
            if (!run) {
              core.notice("No Android CI run found yet.");
              return;
            }

            core.info(`Latest Android CI: #${run.run_number} | ${run.status} | ${run.conclusion || "pending"} | attempt ${run.run_attempt}`);
            core.info(run.html_url);

            if (run.status !== "completed") {
              core.notice("Android build is still running. No action taken.");
              return;
            }

            if (run.conclusion === "success") {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              const apk = artifacts.data.artifacts.find(a => a.name === "PORTAL-debug-apk" && !a.expired);
              if (apk) {
                core.notice(`BUILD SUCCESS: PORTAL-debug-apk is available. Artifact URL: ${apk.archive_download_url}`);
              } else {
                core.setFailed("Build job succeeded but the PORTAL-debug-apk artifact is missing or expired.");
              }
              return;
            }

            if (run.conclusion === "failure" && run.run_attempt < 2) {
              core.warning("Latest Android build failed. Retrying failed jobs once.");
              await github.rest.actions.reRunFailedJobs({
                owner,
                repo,
                run_id: run.id
              });
              core.notice("Retry requested. Check the Android CI workflow for the next attempt.");
              return;
            }

            core.warning(`Latest Android CI concluded: ${run.conclusion}. Automatic retry limit reached or this result is not retryable. A code fix requires diagnosis.`);
